<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Inventory Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#c6c6cd",
                        "secondary-container": "#645efb",
                        "tertiary": "#000000",
                        "on-primary": "#ffffff",
                        "surface": "#f8f9ff",
                        "surface-container-high": "#dde9ff",
                        "on-background": "#0d1c2f",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#3323cc",
                        "surface-bright": "#f8f9ff",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-secondary-container": "#fffbff",
                        "surface-variant": "#d5e3fd",
                        "secondary-fixed": "#e2dfff",
                        "primary": "#000000",
                        "secondary": "#4b41e1",
                        "on-secondary-fixed": "#0f0069",
                        "on-surface": "#0d1c2f",
                        "on-primary-fixed": "#131b2e",
                        "on-primary-container": "#7c839b",
                        "inverse-surface": "#233144",
                        "outline": "#76777d",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#009668",
                        "tertiary-container": "#002113",
                        "tertiary-fixed-dim": "#4edea3",
                        "surface-dim": "#ccdbf4",
                        "background": "#f8f9ff",
                        "surface-container-low": "#eff4ff",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-error": "#ffffff",
                        "primary-fixed": "#dae2fd",
                        "tertiary-fixed": "#6ffbbe",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#d5e3fd",
                        "inverse-on-surface": "#ebf1ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#565e74",
                        "primary-container": "#131b2e",
                        "surface-container": "#e6eeff",
                        "on-surface-variant": "#45464d",
                        "secondary-fixed-dim": "#c3c0ff",
                        "inverse-primary": "#bec6e0",
                        "primary-fixed-dim": "#bec6e0",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#002113",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "container-padding": "24px",
                        "gutter": "16px",
                        "stack-sm": "8px",
                        "unit": "4px",
                        "stack-md": "16px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "title-sm": ["Inter"],
                        "data-mono": ["jetbrainsMono"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "title-sm": ["18px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-4">
<!-- Main Canvas: Suppressed navigation shell for login screen as per instructions -->
<div class="w-full max-w-md bg-surface rounded-xl border border-outline-variant shadow-lg p-container-padding flex flex-col gap-stack-lg relative overflow-hidden">
<!-- Decorative Header -->
<div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-secondary to-primary-container"></div>
<div class="flex flex-col items-center gap-stack-sm text-center">
<div class="w-16 h-16 bg-surface-container-high rounded-full flex items-center justify-center text-secondary mb-2 border border-outline-variant">
<span class="material-symbols-outlined" data-icon="inventory_2" style="font-variation-settings: 'FILL' 1; font-size: 32px;">inventory_2</span>
</div>
<h1 class="text-headline-md font-headline-md text-on-surface">Inventory Pro</h1>
<p class="text-body-sm font-body-sm text-on-surface-variant">Sign in to manage your enterprise assets</p>
</div>
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault(); window.location.href='#';">
<div class="flex flex-col gap-unit">
<label class="text-body-sm font-body-sm font-semibold text-on-surface" for="email">Email or Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-[#F1F5F9] border border-[#CBD5E1] rounded text-body-md font-body-md text-on-surface focus:bg-white focus:border-secondary focus:ring-2 focus:ring-secondary-container focus:outline-none transition-all placeholder-on-surface-variant/50" id="email" name="email" placeholder="admin@enterprise.com" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-unit">
<div class="flex justify-between items-center">
<label class="text-body-sm font-body-sm font-semibold text-on-surface" for="password">Password</label>
<a class="text-body-sm font-body-sm text-secondary hover:text-secondary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-[#F1F5F9] border border-[#CBD5E1] rounded text-body-md font-body-md text-on-surface focus:bg-white focus:border-secondary focus:ring-2 focus:ring-secondary-container focus:outline-none transition-all placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center gap-2 mt-2">
<input class="w-4 h-4 text-secondary border-outline rounded focus:ring-secondary" id="remember" type="checkbox"/>
<label class="text-body-sm font-body-sm text-on-surface-variant" for="remember">Remember me on this device</label>
</div>
<button class="w-full bg-[#4F46E5] hover:bg-[#4338CA] text-white py-3 px-4 rounded text-title-sm font-title-sm flex justify-center items-center gap-2 transition-all shadow-sm active:scale-[0.98] mt-stack-sm" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="text-center border-t border-outline-variant pt-stack-md mt-stack-sm">
<p class="text-label-caps font-label-caps text-on-surface-variant">SECURE ENTERPRISE LOGIN PORTAL</p>
<p class="text-body-sm font-body-sm text-on-surface-variant/70 mt-1">© 2024 Inventory Pro Systems</p>
</div>
</div>
</body></html>

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Product images / business logos can be uploaded through the API.
    client_max_body_size 25m;

    # Resolve the backend service through Docker's embedded DNS and re-resolve
    # periodically, so nginx keeps working when the backend container is
    # recreated with a new IP address (e.g. after `docker compose up --build`).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8040;

    # SPA: serve static assets, fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> backend service (same Docker network).
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files served by the backend.
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
